name: Sync fork dev

on:
  schedule:
    - cron: "17 1 * * *" # UTC 1:17 = 北京时间每日 9:17
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync dev from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh repo sync jinghero/AUTO-MAS -b dev
